# UCM2 profile for the Universal Audio Apollo x4 (Thunderbolt, ua_apollo driver)
# Deploy to: /usr/share/alsa/ucm2/ua_apollo/ua_apollo.conf
# Symlink from: /usr/share/alsa/ucm2/conf.d/ua_apollo/ua_apollo.conf
#
# alsa-lib finds this through conf.d/${CardDriver}/${CardDriver}.conf, and every
# Apollo model registers with the card driver name "ua_apollo".  The channel
# layout in HiFi.conf is the Apollo x4 one, so the use case is only offered
# when the card name is exactly "Apollo x4".  Other models (and "Apollo x4
# Gen 2") get no UCM profile rather than a wrongly labelled one.

Syntax 6

If.apollo_x4 {
	Condition {
		Type String
		String1 "${CardName}"
		String2 "Apollo x4"
	}
	True {
		SectionUseCase."HiFi" {
			File "HiFi.conf"
			Comment "Apollo x4: 24 playback / 22 capture channels (firmware IO layout)"
		}
	}
}
