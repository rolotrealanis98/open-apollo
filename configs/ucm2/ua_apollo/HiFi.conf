# UCM2 HiFi use case for the Universal Audio Apollo x4
#
# Channel order, as listed by /proc/asound/cardN/io_map with the driver's
# default firmware IO-descriptor layout (io_map=-1) at 44.1/48 kHz:
#
# Playback (24 ALSA channels):
#   ch  0-1 : MON L/R           ch  2-5 : LINE 1-4
#   ch  6-7 : S/PDIF L/R        ch  8-15: VIRTUAL 1-8
#   ch 16-23: CUE1 L/R .. CUE4 L/R
#
# Capture (22 ALSA channels):
#   ch  0-1 : MIC/LINE/HIZ 1-2  ch  2-3 : MIC/LINE 3-4
#   ch  4-5 : S/PDIF L/R        ch  6-13: VIRTUAL 1-8
#   ch 14-15: MON L/R           ch 16-17: AUX1 L/R
#   ch 18-19: AUX2 L/R          ch 20-21: TALKBACK 1-2
#
# The ALSA channel count stays 24/22 at every sample rate, but the firmware
# decides which signal sits on which channel and leaves some channels without
# a DMA slot at 176.4/192 kHz (VIRTUAL 7-8 capture and CUE3-4 playback then
# carry no audio).  If a firmware revision reorders channels,
# /proc/asound/cardN/io_map is authoritative, not this file.
#
# This profile deliberately does not touch hardware state:
#   - no sample rate, format or period/buffer is pinned, so the application,
#     PipeWire or the clock source decides;
#   - no ALSA controls are written.  Monitor Playback Volume/Switch, Dim,
#     Mono, Monitor Source, preamp, clock and digital-mode controls are
#     hardware state owned by the user and the mixer daemon, and a UCM
#     "cset" would reset them on every device enable.

SectionVerb {
	EnableSequence [
	]
	DisableSequence [
	]

	Value {
		PlaybackPCM "hw:${CardId}"
		CapturePCM "hw:${CardId}"
	}
}

SectionDevice."Outputs" {
	Comment "Apollo x4 playback (MON, LINE 1-4, S/PDIF, VIRTUAL 1-8, CUE 1-4)"

	EnableSequence [
	]
	DisableSequence [
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId}"
		PlaybackChannels 24
	}
}

SectionDevice."Inputs" {
	Comment "Apollo x4 capture (MIC/LINE 1-4, S/PDIF, VIRTUAL 1-8, MON, AUX 1-2, TALKBACK)"

	EnableSequence [
	]
	DisableSequence [
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId}"
		CaptureChannels 22
	}
}
