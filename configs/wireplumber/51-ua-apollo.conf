# WirePlumber 0.5.x rules for Universal Audio Apollo interfaces
# Deploy to: /etc/wireplumber/wireplumber.conf.d/51-ua-apollo.conf
#
# NOTE: The pro-audio profile must be set via wpctl after PipeWire starts,
# because WirePlumber explicitly excludes pro-audio from auto-selection.
# The apollo-init.sh script handles this.

monitor.alsa.rules = [
  {
    matches = [
      { alsa.driver_name = "ua_apollo" }
    ]
    actions = {
      update-props = {
        # Driver uses copy callbacks (no mmap support)
        api.alsa.disable-mmap = true

        # Keep device open to avoid repeated open/close cycles
        # (Apollo firmware can be sensitive to transport resets)
        session.suspend-timeout-seconds = 0

        # Force S32_LE format (native Apollo format)
        audio.format = "S32LE"

        # Rates the node may run at.  The graph rate (48 kHz unless
        # clock.force-rate says otherwise, e.g. a Console sample-rate
        # change through the mixer daemon) picks one; pinning audio.rate
        # here would keep the Apollo at 48 kHz.
        audio.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]

        # Playback and capture share one clock: schedule both nodes
        # together, so a rate change moves them at once instead of the
        # two re-preparing at different rates in a loop
        node.group = "ua-apollo"

        # Use software volume — don't touch the Apollo hardware monitor level
        api.alsa.soft-mixer = true

        # Node descriptions for Sound Settings UI
        node.nick = "Apollo"
      }
    }
  }

  # Latency the nodes add on top of what ALSA reports (PipeWire
  # latency.internal.*, pipewire-props(7)).  Only what the driver knows
  # (parity/12 L01/L05).  The figures are the macOS driver's, not yet
  # measured with a loopback on this driver, and they change only the latency
  # PipeWire reports to its clients (JACK port latency, pw-top), never the
  # audio.  ALSA reports the same numbers as snd_pcm_runtime.delay (module
  # parameter report_delay); see /proc/asound/cardN/clock.
  #
  #   playback: the FRAME_CFG safety offset: 8 frames at 44.1/48 kHz, 16 at
  #             88.2/96, 32 at 176.4/192 = 166.7 us in every band.  The DAC
  #             latency is not known yet and is not included.
  #   capture:  the Apollo x4 ADC latency: 4.8 frames at 44.1/48 kHz down to
  #             4.4 at 192 kHz, 5 samples at the node rate.
  {
    matches = [
      { node.name = "~alsa_output.*", alsa.driver_name = "ua_apollo" }
    ]
    actions = {
      update-props = {
        latency.internal.ns = 166667
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*", alsa.driver_name = "ua_apollo" }
    ]
    actions = {
      update-props = {
        latency.internal.rate = 5
      }
    }
  }
]
