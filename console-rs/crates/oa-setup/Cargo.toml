[package]
name = "oa-setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Setup wizard for open-apollo: finds your UAD install, imports its assets, installs the driver and the console"

[[bin]]
name = "open-apollo-setup"
path = "src/main.rs"

[dependencies]
oa-assets = { version = "0.1.0", path = "../oa-assets" }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
rfd = "0.17.2"
serde_json = "1.0.154"
