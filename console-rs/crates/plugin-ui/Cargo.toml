[package]
name = "plugin-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# The local WebSocket endpoint UA's HTML GUIs connect to (pure Rust).
bridge = ["dep:tungstenite"]
# Host UA's HTML/JS plug-in GUIs in a WebKitGTK webview (needs webkit2gtk-4.1 and gtk3).
webview = ["bridge", "dep:wry", "dep:gtk", "dep:webkit2gtk", "dep:png"]

[dependencies]
houston = { version = "0.1.0", path = "../houston" }
parking_lot = "0.12.5"
rack = { version = "0.1.0", path = "../rack" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tiny-skia = "0.12"
ua-engine = { version = "0.1.0", path = "../ua-engine" }
png = { version = "0.18.1", optional = true }
tungstenite = { version = "0.30", optional = true, default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "=2.0.2", optional = true, features = ["v2_38"] }
wry = { version = "0.57", optional = true, default-features = false, features = ["os-webview"] }

[dev-dependencies]
gfx = { version = "0.1.0", path = "../gfx" }
png = "0.18.1"

[[example]]
name = "web"
required-features = ["webview"]
