[package]
name = "uaconsole"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Host UA's HTML plug-in GUIs (WebKitGTK via wry; needs webkit2gtk-4.1 and gtk3).
webview = ["plugin-ui/webview"]

[dependencies]
engine-model = { version = "0.1.0", path = "../engine-model" }
gfx = { version = "0.1.0", path = "../gfx" }
houston = { version = "0.1.0", path = "../houston" }
plugin-ui = { version = "0.1.0", path = "../plugin-ui" }
rack = { version = "0.1.0", path = "../rack" }
ua-engine = { version = "0.1.0", path = "../ua-engine" }
winit = "0.30.13"
