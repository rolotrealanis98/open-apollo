# DKMS config for the ua_apollo kernel module (driver/ in the repo).
# scripts/install.sh copies driver/*.c, driver/*.h, driver/Makefile and this
# file to /usr/src/ua_apollo-<PACKAGE_VERSION>/ and runs dkms add/build/install.
PACKAGE_NAME="ua_apollo"
PACKAGE_VERSION="0.2.0"
BUILT_MODULE_NAME[0]="ua_apollo"
BUILT_MODULE_LOCATION[0]=""
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
# Clang-built kernels need CC=clang (detected per target kernel)
MAKE[0]="cc_arg=; [ -f /lib/modules/${kernelver}/build/include/config/CC_IS_CLANG ] && cc_arg=CC=clang; make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build $cc_arg modules"
